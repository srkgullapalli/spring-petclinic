name: Maven Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and configure Maven server
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mvn -v

      - name: Build with Maven (package)
        run: mvn -B -DskipTests clean package

      - name: Show built artifacts
        run: ls -la target || true

      - name: Deploy the built artifact to GitHub Packages
        run: mvn -B -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Notes:
# - Ensure you replace OWNER/REPO in the project's <distributionManagement> in pom.xml.
# - This workflow uses the built-in GITHUB_TOKEN and writes the server credentials into the
#   Maven settings.xml for the duration of the job (actions/setup-java behavior).