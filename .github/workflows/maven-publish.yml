name: Maven Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Maven and GitHub Packages auth
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          server-id: github
          server-username: srkgullapalli
          server-password: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Build with Maven
        run: mvn -B -DskipTests clean package

      - name: Show built artifacts
        run: ls -la target || true

      - name: Deploy to GitHub Packages
        run: mvn -B -DskipTests deploy